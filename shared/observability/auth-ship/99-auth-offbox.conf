# Off-box copy of auth logs → syslog LXC rsyslog :514 (RFC5424).
# Local auth.log / journal still written.
# KeepAlive + small batches: idle TCP drops were delaying some SSH lines by tens of seconds.
auth,authpriv.* action(
  type="omfwd"
  target="192.168.50.89"
  port="514"
  protocol="tcp"
  template="RSYSLOG_SyslogProtocol23Format"
  KeepAlive="on"
  queue.spoolDirectory="/var/spool/rsyslog"
  queue.filename="auth-offbox"
  queue.maxDiskSpace="50m"
  queue.type="LinkedList"
  queue.dequeueBatchSize="1"
  action.resumeRetryCount="-1"
  action.resumeInterval="5"
)
