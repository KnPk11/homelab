services:
  photoprism:
    image: photoprism/photoprism:260728
    container_name: photoprism
    depends_on:
      - photoprism_db
    networks:
      - caddy_public
      - photoprism_internal
    ports:
      - "2342:2342"
    env_file:
      - ${PHOTOPRISM_ENV_PATH:-/srv/photoprism/.env}
    environment:
      - PHOTOPRISM_ADMIN_PASSWORD_FILE=/run/secrets/photoprism_password
      - PHOTOPRISM_DATABASE_DRIVER=mysql
      - PHOTOPRISM_DATABASE_SERVER=photoprism_db:3306
      - PHOTOPRISM_DATABASE_NAME=photoprism
      - PHOTOPRISM_DATABASE_USER=photoprism
      - PHOTOPRISM_DATABASE_PASSWORD=${PHOTOPRISM_DATABASE_PASSWORD}
      - PHOTOPRISM_DATABASE_PASSWORD_FILE=/run/secrets/photoprism_database_password
      - PHOTOPRISM_WORKERS=2
      - PUID=1000
      - PGID=1000
      - UMASK=0000
      - TZ=Europe/London
    secrets:
      - photoprism_password
      - photoprism_database_password
    volumes:
      - /srv/photoprism/storage:/photoprism/storage
      - "/mnt/nas/Shared/Content/Space photos:/photoprism/originals/space:ro"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    mem_limit: 2g
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 1024M


  photoprism_db:
    image: mariadb:10.11
    container_name: photoprism_db
    environment:
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/photoprism_mysql_root_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/photoprism_mysql_root_password
      - MARIADB_DATABASE=photoprism
      - MYSQL_DATABASE=photoprism
      - MARIADB_USER=photoprism
      - MYSQL_USER=photoprism
      - MARIADB_PASSWORD_FILE=/run/secrets/photoprism_database_password
      - MYSQL_PASSWORD_FILE=/run/secrets/photoprism_database_password
    secrets:
      - photoprism_mysql_root_password
      - photoprism_database_password
    networks:
      - photoprism_internal
    volumes:
      - /srv/photoprism/database:/var/lib/mysql
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M


volumes:
  photoprism_db:

networks:
  caddy_public:
    external: true
  photoprism_internal:
    driver: bridge
    internal: true

secrets:
  photoprism_database_password:
    file: ${PHOTOPRISM_DB_PASSWORD_PATH:-/srv/photoprism/photoprism_database_password.secret}
  photoprism_mysql_root_password:
    file: ${PHOTOPRISM_MYSQL_ROOT_PASSWORD_PATH:-/srv/photoprism/photoprism_mysql_root_password.secret}
  photoprism_password:
    file: ${PHOTOPRISM_PASSWORD_PATH:-/srv/photoprism/photoprism_password.secret}