version: '3.8'

services:    
  webdav:
    image: hacdias/webdav:latest
    container_name: media-webdav
    restart: unless-stopped
    ports:
      - "8084:80"
    environment:
      - TZ=Europe/London
    volumes:
      - ${WEBDAV_CONFIG_PATH:-/srv/webdav/config.yaml}:/etc/webdav/config.yaml:ro
      - /mnt/nas/Media:/data
    command: ["-c", "/etc/webdav/config.yaml"]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
