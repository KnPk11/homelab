services:
  # 1. One-shot builder that compiles static gallery HTML & thumbnails
  thumbsup_builder:
    image: thumbsupgallery/thumbsup:latest
    container_name: thumbsup_builder
    command: >
      thumbsup
      --input /input
      --output /output
      --theme cards
      --title "Space Photos Gallery"
      --small-size 500
      --large-size 1600
      --sort-albums-by name
      --cleanup
    volumes:
      - "/mnt/nas/Shared/Content/Space photos:/input:ro"
      - /srv/space-gallery:/output
    restart: "no"

  # 2. Static Web Server exposing the gallery to Caddy on port 8182
  space_gallery:
    image: nginx:alpine
    container_name: space_gallery
    ports:
      - "8182:80"
    volumes:
      - /srv/space-gallery:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - thumbsup_builder
