type: http
name: http_default
log_level: info
group_wait: 10s
timeout: 10s
format: |
  {
    "chat_id": "${TELEGRAM_CHAT_ID}",
    "text": "{{range . -}}{{range .Decisions -}}CrowdSec: {{.Value}} → {{.Type}} {{.Duration}} ({{.Scenario}}){{end -}}{{end -}}"
  }
url: https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
method: POST
headers:
  Content-Type: "application/json"
