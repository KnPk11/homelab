[Definition]
# Use <ip> and <bantime> (seconds) from Fail2Ban.
# We use 's' suffix for CrowdSec duration.
# Also append to the monitor's JSONL history so Fail2Ban bans survive
# process_logs.sh truncating /var/log/fail2ban.log at midnight.
actionban = cscli decisions add --ip <ip> --duration <bantime>s --reason 'Fail2Ban: <name>'; /usr/bin/python3 /srv/fail2ban-monitor/fail2ban_bans.py --record --ip <ip> --jail <name> --source F2B
actionunban = cscli decisions delete --ip <ip>
