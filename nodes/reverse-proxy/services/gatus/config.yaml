web:
  port: 8081

storage:
  type: sqlite
  path: /srv/gatus/data.db

ui:
  title: "${DOMAIN_NAME} Status"
  header: "System Status"

endpoints:
  # --- Infrastructure ---
  - name: Internet
    group: Infrastructure
    url: "icmp://1.1.1.1"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: Reverse Proxy
    group: Infrastructure
    url: "tcp://127.0.0.1:80"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: DNS
    group: Infrastructure
    url: "tcp://${DNS_NODE_IP}:53"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: Main Homelab
    group: Infrastructure
    url: "icmp://${HOMELAB_NODE_IP}"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: AI Tools
    group: Infrastructure
    url: "icmp://${AITOOLS_NODE_IP}"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: Pulse
    group: Infrastructure
    url: "icmp://${PULSE_NODE_IP}"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: OpenClaw
    group: Infrastructure
    url: "icmp://${OPENCLAW_NODE_IP}"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: OpenMediaVault
    group: Infrastructure
    url: "icmp://${OMV_NODE_IP}"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: K8S
    group: Infrastructure
    url: "icmp://${MINI_K8S_NODE_IP}"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: Scratch PC
    group: Infrastructure
    url: "icmp://${SCRATCH_PC_NODE_IP}"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  # --- Storage ---
  - name: Nextcloud
    group: Storage
    url: "http://${HOMELAB_NODE_IP}:8104"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"

  - name: Filebrowser
    group: Storage
    url: "http://${HOMELAB_NODE_IP}:9101"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"

  - name: Syncthing
    group: Storage
    url: "http://${AITOOLS_NODE_IP}:8384"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"

  # --- Media ---
  - name: Jellyfin
    group: Media
    url: "http://${HOMELAB_NODE_IP}:8096"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"

  - name: Photoprism
    group: Media
    url: "http://${HOMELAB_NODE_IP}:2342"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] < 400"

  - name: Immich
    group: Media
    url: "http://${HOMELAB_NODE_IP}:2283"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"

  # --- AI ---
  - name: OpenWebUI
    group: AI
    url: "http://${HOMELAB_NODE_IP}:3002"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"

  # --- Tools ---
  - name: PrivateBin
    group: Tools
    url: "http://${HOMELAB_NODE_IP}:8180"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"

  - name: Airflow
    group: Tools
    url: "http://${HOMELAB_NODE_IP}:8094"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"

  - name: n8n
    group: Tools
    url: "http://${HOMELAB_NODE_IP}:5678"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"

  # --- Monitoring ---
  - name: Grafana
    group: Monitoring
    url: "http://${HOMELAB_NODE_IP}:3005"
    interval: 30s
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
