web:
  port: 8081

storage:
  type: sqlite
  path: /srv/gatus/data.db

ui:
  title: "${DOMAIN_NAME} Status"
  header: "System Status"

# Homelab Watch — custom sendMessage (one line).
# default-alert only fills thresholds; each endpoint still needs alerts: *homelab-watch.
alerting:
  custom:
    url: "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
    method: "POST"
    headers:
      Content-Type: "application/json"
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: "down"
        RESOLVED: "up"
    body: |
      {
        "chat_id": "${TELEGRAM_CHAT_ID}",
        "text": "📡 [ENDPOINT_NAME] [ALERT_TRIGGERED_OR_RESOLVED]"
      }
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  # --- Infrastructure ---
  - name: Internet
    group: Infrastructure
    url: "icmp://1.1.1.1"
    interval: 30s
    alerts: &homelab-watch
      - type: custom
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: Reverse Proxy
    group: Infrastructure
    url: "tcp://127.0.0.1:80"
    interval: 30s
    alerts: *homelab-watch
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[CONNECTED] == true"

  - name: DNS
