[global]
   workgroup = WORKGROUP
   server role = standalone server
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   map to guest = never
   load printers = no
   printing = bsd
   disable spoolss = yes
   server min protocol = SMB2

[logs]
   comment = Off-box auth logs (read-only plaintext)
   path = /mnt/logs
   browseable = yes
   read only = yes
   guest ok = no
   valid users = loguser
   # Same idea as reverse-proxy [logs]: main LAN, WireGuard, vpns LXC
   hosts allow = 192.168.88. 10.5. 192.168.50.87 127.0.0.1
   hosts deny = 0.0.0.0/0
   force user = loguser
   force group = loguser
