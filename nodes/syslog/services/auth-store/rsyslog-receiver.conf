# TCP 514 from the fleet → /mnt/logs/auth/<host>/auth.log
# Senders already filter auth,authpriv (shared/observability/auth-ship).
module(load="imtcp")
input(type="imtcp" port="514" ruleset="remoteauth")

template(name="AuthFile" type="string" string="/mnt/logs/auth/%$!loghost%/auth.log")
template(name="AuthLine" type="string"
         string="%timegenerated:::date-year%-%timegenerated:::date-month%-%timegenerated:::date-day% %timegenerated:::date-hour%:%timegenerated:::date-minute%:%timegenerated:::date-second% %$!loghost% %syslogtag%%msg:::drop-last-lf%\n")

ruleset(name="remoteauth") {
  set $!loghost = $hostname;
  if ($hostname == "pve1") then {
    set $!loghost = "proxmox-host";
  }
  if ($syslogfacility-text == "auth") or ($syslogfacility-text == "authpriv") then {
    action(
      type="omfile"
      dynaFile="AuthFile"
      template="AuthLine"
      dirCreateMode="0755"
      FileCreateMode="0644"
      fileOwner="root"
      fileGroup="root"
      dirOwner="root"
      dirGroup="root"
      asyncWriting="off"
      flushOnTXEnd="on"
      flushInterval="1"
      ioBufferSize="1k"
    )
  }
  stop
}
